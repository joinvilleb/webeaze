<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Support Status | WebEaze</title>
  <meta name="description" content="Support hours and service updates have moved to your WebEaze client portal." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://portal.webeaze.io" />
  <!-- Support status/hours now live in the client portal. Redirect there. -->
  <meta http-equiv="refresh" content="0; url=https://portal.webeaze.io" />
  <script>window.location.replace('https://portal.webeaze.io');</script>
  <link rel="shortcut icon" href="images/webeaze-transparent-copy.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Poppins', sans-serif;
      background: #f5f6fa; color: #1a1a2e; text-align: center; padding: 24px;
    }
    .redirect-card { max-width: 440px; }
    .redirect-card img { height: 34px; margin-bottom: 26px; }
    .spinner {
      width: 34px; height: 34px; margin: 0 auto 22px;
      border: 3px solid rgba(120,81,169,.18); border-top-color: #7851a9;
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.3rem; font-weight: 700; margin: 0 0 10px; }
    p { color: #6b7280; font-size: .95rem; line-height: 1.55; margin: 0 0 22px; }
    a.portal-link {
      display: inline-block; text-decoration: none;
      background: #7851a9; color: #fff; font-weight: 600; font-size: .92rem;
      padding: 11px 22px; border-radius: 10px; transition: background .15s;
    }
    a.portal-link:hover { background: #5f3d94; }
  </style>
</head>
<body>
  <div class="redirect-card">
    <img src="images/webeaze-transparent-copy.png" alt="WebEaze" />
    <div class="spinner"></div>
    <h1>Support status has moved</h1>
    <p>Your support hours, holiday schedule, and service updates now live in your client portal. Taking you there now.</p>
    <a class="portal-link" href="https://portal.webeaze.io">Go to your portal</a>
  </div>
<script src="https://portal.webeaze.io/track.js" data-key="85dbb6dc-0a48-4853-a645-20d08f12a045" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're Booked! | WebEaze</title>
  <meta name="description" content="Thanks for booking. Your meeting with WebEaze is confirmed." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="shortcut icon" href="images/webeaze-transparent-copy.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0f0f0f;
      --bg-2: #161616;
      --gold: #ffd700;
      --text: #ffffff;
      --muted: #9ca3af;
      --line: rgba(255,255,255,.1);
      --brand: #7851a9;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      font-size: 1.125rem;
      line-height: 1.7;
    }
    a { color: var(--gold); text-decoration: none; }
    a:hover { opacity: .8; }

    /* BACK TO PORTAL (phone + video variants, which are booked from the portal) */
    .backbar { max-width: 960px; margin: 0 auto; padding: 20px 20px 0; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px 8px 10px;
      border: 1px solid var(--line); border-radius: 999px;
      font-size: .9rem; font-weight: 600; color: var(--text);
      transition: border-color .15s, background .15s;
    }
    .back-link svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .back-link:hover { border-color: rgba(255,215,0,.4); background: rgba(255,215,0,.05); color: var(--text); opacity: 1; }
    .backbar + .hero { padding-top: 40px; }

    /* HERO */
    .hero {
      text-align: center;
      padding: 80px 20px 64px;
      border-bottom: 1px solid var(--line);
    }
    .checkmark {
      width: 80px; height: 80px; border-radius: 50%;
      margin: 0 auto 20px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center;
      animation: pop .5s ease-out both, pulse 3s ease-in-out 1s infinite;
    }
    .checkmark svg {
      width: 42px; height: 42px; stroke: var(--gold); stroke-width: 3;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 90; stroke-dashoffset: 90;
      animation: draw .9s .4s ease forwards;
    }
    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes pop   { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,215,0,.15); } 50% { box-shadow: 0 0 18px 4px rgba(255,215,0,.08); } }

    .hero h1 {
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 700; letter-spacing: -.04em;
      margin: 0 0 14px;
    }
    .hero p {
      font-size: 1.1rem; color: var(--muted);
      max-width: 560px; margin: 0 auto 24px; line-height: 1.75;
    }
    .pill {
      display: inline-block; padding: 6px 18px;
      border-radius: 999px; font-size: .9rem;
      background: rgba(255,255,255,.07);
      border: 1px solid var(--line);
    }

    /* STEPS */
    .steps {
      padding: 64px 20px;
      max-width: 960px; margin: 0 auto;
    }
    .steps-label {
      font-size: .78rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .12em; color: var(--muted); margin-bottom: 10px;
    }
    .steps h2 {
      font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700;
      letter-spacing: -.03em; margin: 0 0 32px;
    }
    .steps-grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(3, 1fr);
    }
    @media (max-width: 680px) { .steps-grid { grid-template-columns: 1fr; } }
    .step-card {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 16px; padding: 28px 24px;
    }
    .step-num {
      font-size: .8rem; font-weight: 700; color: var(--gold);
      text-transform: uppercase; letter-spacing: .1em;
      margin-bottom: 12px; display: block;
    }
    .step-card h3 {
      font-size: 1.15rem; font-weight: 700;
      margin: 0 0 10px; letter-spacing: -.02em;
    }
    .step-card p {
      font-size: 1rem; color: var(--muted);
      margin: 0; line-height: 1.7;
    }
    .step-card .callout {
      margin-top: 14px; padding: 12px 16px;
      background: rgba(255,215,0,.07);
      border: 1px solid rgba(255,215,0,.2);
      border-radius: 8px;
      font-size: .95rem; color: var(--text);
    }
    .step-card .callout strong { color: var(--gold); }

    /* BOTTOM BAR */
    .bottom {
      border-top: 1px solid var(--line);
      padding: 48px 20px 56px;
      text-align: center;
    }
    .reschedule-note {
      font-size: 1rem; color: var(--muted);
      max-width: 520px; margin: 0 auto 32px;
      line-height: 1.7;
    }
    .links-row {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    }
    .link-btn {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 1rem; font-weight: 600;
      color: var(--text);
      transition: border-color .15s, background .15s;
    }
    .link-btn:hover { border-color: rgba(255,215,0,.4); background: rgba(255,215,0,.05); color: var(--text); opacity: 1; }
    .link-btn.primary {
      background: var(--gold); color: #000;
      border-color: transparent; font-weight: 700;
    }
    .link-btn.primary:hover { opacity: .88; background: var(--gold); }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--line);
      padding: 28px 20px;
      text-align: center;
      font-size: .82rem; color: var(--muted);
    }
    footer a { color: var(--muted); }
    footer a:hover { color: var(--gold); opacity: 1; }
  </style>
</head>
<body>
<!-- PORTAL LIVE BANNER (auto-hides after July 15, 2026) -->
<div id="wb-portal-banner" style="background:rgba(120,81,169,.10);border-bottom:1px solid rgba(120,81,169,.25);padding:9px 20px;text-align:center;font-size:13px;font-weight:500;color:#4b3a66;">
  <strong style="color:#7851a9;">Your client portal is live.</strong> Sign in at <a href="https://portal.webeaze.io" target="_blank" rel="noopener" style="color:#7851a9;text-decoration:underline;">portal.webeaze.io</a> to request changes and track updates.
</div>
<script>(function(){if(new Date()>=new Date('2026-07-16T04:00:00Z')){var b=document.getElementById('wb-portal-banner');if(b)b.remove();}})();</script>

<div class="backbar" id="backbar" hidden>
  <a class="back-link" id="back-portal" href="https://portal.webeaze.io">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    Back to portal
  </a>
</div>

<div class="hero">
  <div class="checkmark" aria-hidden="true">
    <svg viewBox="0 0 52 52"><path d="M14 27l8 8 16-18"/></svg>
  </div>
  <h1 id="hero-h1">You're Booked!</h1>
  <p id="hero-lead"><A></A> calendar invite has been emailed to you.</p>
  <span class="pill" id="hero-pill">Confirmed</span>
</div>

<div class="steps">
  <div class="steps-label" id="steps-label">Next steps</div>
  <h2 id="steps-heading">Before your session</h2>
  <div class="steps-grid" id="steps-grid"></div>
</div>

<div class="bottom">
  <p class="reschedule-note" id="reschedule-note"></p>
  <div class="links-row" id="links-row"></div>
</div>

<footer>
  <p>&copy; <span id="yr"></span> WebEaze &nbsp;&middot;&nbsp;
    <a href="terms.html#privacy">Privacy</a> &nbsp;&middot;&nbsp;
    <a href="terms.html">Terms</a>
  </p>
</footer>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

var CONFIGS = {
  consultation: {
    h1:       "You're Booked!",
    lead:     "A calendar link has been emailed to you.",
    pill:     "Free Discovery Call",
    label:    "Before",
    heading:  "Prepare for the call",
    steps: [
      {
        num:   "Step 1",
        title: "Check your email",
        body:  "A calendar invite has been emailed to you. It includes the links to join, cancel, and reschedule if needed."
      },
      {
        num:   "Step 2",
        title: "Gather your ideas",
        body:  "Logos, colors, or websites you like are helpful to share. Anything helps. "
      },
      {
        num:   "Step 3",
        title: "Check your tech",
        body:  "Join from a quiet spot, and test your mic/camera ahead of time to avoid delays or problems."
      }
    ],
    reschedule: "Changed your mind, or need to reschedule? Use the links provided in your calendar invite. ",
    links: [
      { label: "View Plans",  href: "pricing.html",  primary: true },
      { label: "Client Portal", href: "https://portal.webeaze.io" },
      { label: "Help Center",     href: "help.html" },
      { label: "About Us",   href: "about.html" }
    ]
    
  },

  phone: {
    h1:      "Talk soon!",
    lead:    "We'll call you at your scheduled time. Check your email for information.",
    pill:    "Phone Support",
    portalBack: true,
    label:   "Before",
    heading: "Prepare for the call",
    steps: [
      {
        num:     "Step 1",
        title:   "Save our number",
        body:    "We'll call from (347) 377-2408. Save it to your contacts now so you don't miss us.",
        callout: "Incoming call from <strong>(347) 377-2408</strong> at your scheduled time."
      },
      {
        num:   "Step 2",
        title: "Open your website",
        body:  "Pull up your site in a browser before the call if you can for reference. "
      },
      {
        num:   "Step 3",
        title: "Note your questions",
        body:  "Note anything you'd like to cover. We'll answer them and follow up if needed. "
      }
    ],
    reschedule: "Need to reschedule or cancel? Use the links in your email.  Otherwise, you're set and we'll call you soon.",
    links: [
      { label: "Submit Request", href: "https://portal.webeaze.io", primary: true },
      { label: "Help Center",      href: "help.html" },
      { label: "Fee Schedule",     href: "fee-schedule.html" }
    ]
  },

  meet: {
    h1:      "See you soon.",
    lead:    "Your video session is booked. We've emailed you a calendar invite. ",
    pill:    "Video Session",
    portalBack: true,
    label:   "Before",
    heading: "How to prepare for your video session",
    steps: [
      {
        num:   "Step 1",
        title: "Check your email",
        body:  "We emailed you a calendar invite when you booked. "
      },
      {
        num:   "Step 2",
        title: "Test your environment",
        body:  "Test your mic/camera before the call. It's best to join from a desktop/laptop using Chrome. "
      },
      {
        num:   "Step 3",
        title: "Have your site open",
        body:  "Pull up the page(s) you need help with for reference. We'll screenshare if needed."
      }
    ],
    reschedule: "Need to reschedule or cancel? Use the links in your email. Otherwise, see you at your scheduled time.",
    links: [
      { label: "Client Portal", href: "https://portal.webeaze.io", primary: true },
      { label: "Help Center",      href: "help.html" },
      { label: "Fee Schedule",     href: "fee-schedule.html" }
    ]
  }
};

function render(cfg) {
  document.getElementById('hero-h1').textContent   = cfg.h1;
  document.getElementById('hero-lead').textContent = cfg.lead;
  document.getElementById('hero-pill').textContent = cfg.pill;
  document.getElementById('steps-label').textContent   = cfg.label;
  document.getElementById('steps-heading').textContent = cfg.heading;

  document.getElementById('steps-grid').innerHTML = cfg.steps.map(function(s) {
    return '<div class="step-card">' +
      '<span class="step-num">' + s.num + '</span>' +
      '<h3>' + s.title + '</h3>' +
      '<p>' + s.body + '</p>' +
      (s.callout ? '<div class="callout">' + s.callout + '</div>' : '') +
    '</div>';
  }).join('');

  document.getElementById('reschedule-note').textContent = cfg.reschedule;

  document.getElementById('links-row').innerHTML = cfg.links.map(function(l) {
    return '<a class="link-btn' + (l.primary ? ' primary' : '') + '" href="' + l.href + '">' + l.label + '</a>';
  }).join('');
}

// Phone and video sessions are booked from a popup in the portal. HubSpot's post-booking redirect
// lands this page INSIDE that popup's iframe, so a plain link to the portal would load the whole
// portal inside its own popup. When embedded we ask the portal to close the popup instead. The
// portal lives on another origin, so that has to be a postMessage. If the portal does not answer
// (an older deploy, or the popup was opened some other way) we fall back to reloading the portal
// in the top window. Opened on its own, every portal link is just a normal link.
var PORTAL_URL = 'https://portal.webeaze.io';
var EMBEDDED = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();

function backToPortal(e) {
  if (!EMBEDDED) return;              // normal navigation
  e.preventDefault();
  try { window.parent.postMessage({ type: 'webeaze:close-booking' }, PORTAL_URL); } catch (_) {}
  // Closing the popup blanks this iframe, which cancels the timer. Still here means nobody listened.
  setTimeout(function () {
    try { window.top.location.href = PORTAL_URL; } catch (_) { window.open(PORTAL_URL, '_blank', 'noopener'); }
  }, 450);
}

function wireLinks(cfg) {
  if (cfg.portalBack) {
    document.getElementById('backbar').hidden = false;
    document.getElementById('back-portal').addEventListener('click', backToPortal);
  }
  var links = document.querySelectorAll('#links-row a, #back-portal');
  for (var i = 0; i < links.length; i++) {
    var a = links[i];
    if (a.id === 'back-portal') continue;
    if (a.href.indexOf(PORTAL_URL) === 0) a.addEventListener('click', backToPortal);
    else if (EMBEDDED) { a.target = '_blank'; a.rel = 'noopener'; }  // don't take over the popup
  }
}

var type = new URLSearchParams(window.location.search).get('type') || 'consultation';
var cfg  = CONFIGS[type] || CONFIGS.consultation;
render(cfg);
wireLinks(cfg);

// Personalize h1 with first name if stored
(function() {
  try {
    var name = JSON.parse(localStorage.getItem('wz_user_name'));
    if (name) {
      var h1 = document.getElementById('hero-h1');
      if (h1) h1.textContent = cfg.h1.replace('!', ', ' + name + '!');
    }
  } catch(e) {}
})();
</script>
<script src="https://portal.webeaze.io/track.js" data-key="85dbb6dc-0a48-4853-a645-20d08f12a045" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Bake 350 OG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Open Graph card, exactly 1200x630. These render small in feeds, so type stays large
   and the composition stays simple. Palette taken from their site. */
:root{ --tan:#a3773b; --brown:#685136; --deep:#5a3b1c; --caramel:#c67b5b; --cream:#fdf7ee; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
     background:#dedde3;padding:24px;display:flex;flex-direction:column;gap:24px}
.og{width:1200px;height:630px;position:relative;overflow:hidden;flex-shrink:0}

/* ── A: cream, logo + line left, cookie right ── */
.a{background:var(--cream);display:flex;align-items:center;padding:0 0 0 78px}
.a .dots{position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(var(--tan) 2.4px, transparent 2.4px);
  background-size:34px 34px;-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.22),transparent 55%)}
.a .copy{position:relative;z-index:1;width:600px}
.a .copy img{width:392px;display:block;margin-bottom:34px}
.a h1{font-size:47px;font-weight:700;line-height:1.2;letter-spacing:-.02em;color:var(--deep)}
.a h1 span{color:var(--caramel)}
.a .meta{margin-top:26px;display:flex;align-items:center;gap:14px;font-size:23px;font-weight:600;color:var(--brown)}
.a .meta i{width:7px;height:7px;border-radius:50%;background:var(--tan);display:block}
.a .shot{position:absolute;right:-72px;top:50%;transform:translateY(-50%);width:560px;
         filter:drop-shadow(0 30px 50px rgba(90,59,28,.28))}

/* ── B: deep brown, cookie left, copy right ── */
.b{background:radial-gradient(120% 130% at 12% 30%, #7a5a2e 0%, var(--deep) 62%, #3f280f 100%);
   display:flex;align-items:center;color:var(--cream);padding:0 78px 0 0}
.b .shot{width:470px;flex-shrink:0;margin-left:-52px;filter:drop-shadow(0 26px 46px rgba(0,0,0,.42))}
.b .copy{flex:1;padding-left:34px}
.b .badge{display:inline-block;background:var(--cream);border-radius:16px;padding:15px 22px;margin-bottom:30px}
.b .badge img{width:250px;display:block}
.b h1{font-size:46px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.b h1 span{color:#f0c088}
.b .meta{margin-top:24px;font-size:22px;font-weight:600;color:rgba(253,247,238,.72)}
</style></head><body>

<div class="og a" id="og-a">
  <div class="dots"></div>
  <div class="copy">
    <img src="logo.png" alt="">
    <h1>On a mission to bake<br>the world a <span>better place.</span></h1>
    <div class="meta"><span>Libertyville, IL</span><i></i><span>bake350degrees.com</span></div>
  </div>
  <img class="shot" src="cookie.png" alt="">
</div>

<div class="og b" id="og-b">
  <img class="shot" src="cookie.png" alt="">
  <div class="copy">
    <div class="badge"><img src="logo.png" alt=""></div>
    <h1>Cookies, brownies and bars,<br>baked <span>fresh in Libertyville.</span></h1>
    <div class="meta">bake350degrees.com</div>
  </div>
</div>

</body></html>

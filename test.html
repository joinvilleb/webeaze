<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Test Page | WebEaze</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="shortcut icon" href="images/webeaze-transparent-copy.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --brand:#7851a9; --brand-dark:#5a3d84; --text:#0f1228; --muted:#4b5563; --line:#e5e7eb; }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Poppins',sans-serif;
    background:#f8f9fc;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1.5rem;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:0 12px 40px rgba(15,18,40,.08);
    max-width:480px;
    width:100%;
    padding:2.75rem 2.25rem;
    text-align:center;
  }
  .logo{ width:54px; height:auto; margin-bottom:1.25rem; }
  .badge{
    display:inline-block;
    font-size:.7rem;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--brand);
    background:rgba(120,81,169,.1);
    border-radius:100px;
    padding:.3rem .8rem;
    margin-bottom:1.1rem;
  }
  h1{ font-size:1.5rem; font-weight:700; letter-spacing:-0.05em; color:#0a0a0a; margin-bottom:.75rem; }
  p{ font-size:1rem; color:var(--muted); margin-bottom:1.75rem; }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    background:var(--brand);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    font-size:.95rem;
    border-radius:10px;
    padding:.8rem 1.6rem;
    transition:background .2s;
  }
  .btn:hover{ background:var(--brand-dark); }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="images/webeaze-transparent-copy.png" alt="WebEaze" />
    
    <h1>This is a test website</h1>
    <p>You're probably here to test a few things from us. Head back to the WebEaze home page to keep going.</p>
    <a class="btn" href="https://webeaze.io">Go to WebEaze Home</a>
  </main>
<script src="https://portal.webeaze.io/track.js" data-key="85dbb6dc-0a48-4853-a645-20d08f12a045" defer></script>
</body>
</html>

<style>
:root {
  --brand: #7851a9;
  --gold:  #ffd700;
  --text:  #111827;
  --muted: #4b5563;
  --bg:    #ffffff;
  --bg-2:  #f5f6fa;
  --line:  rgba(0,0,0,.09);
  --green: #16a34a;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
img { max-width: 100%; height: auto; width: auto; }
html { scroll-behavior: smooth; }
body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
a { text-decoration: none; color: inherit; }
.container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
.container-mid { max-width: 680px; margin: 0 auto; padding: 0 20px; }

/* NAV */
.logo { height: 36px; }
.nav-wrap {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
  background: rgba(10,10,15,.95);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.webeaze-nav { background: transparent !important; box-shadow: none !important; padding: .6rem 0; }
.brand-word { letter-spacing: -.3px; font-weight: 700; color: #fff; }
.navbar-dark .nav-link { color: #fff !important; opacity: .85; border-radius: 10px; padding: .45rem .7rem; }
.navbar-dark .nav-link:hover { opacity: 1; background: rgba(255,255,255,.08); }
.btn-nav { background: var(--gold); color: #2f1e66; border: none; border-radius: 10px; padding: .55rem .85rem; font-weight: 700; font-size: .9rem; }

/* TOP SECTION - quiz + booking */
.top-wrap {
  padding-top: 80px;
  background: var(--bg-2);
  min-height: 100vh;
}
.top-inner {
  max-width: 1060px; margin: 0 auto; padding: 56px 20px 80px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 52px; align-items: start;
}
.top-left { display: flex; flex-direction: column; }
.top-right { display: flex; flex-direction: column; gap: 0; }
.top-visual { margin-top: 28px; }
.top-visual img { width: 100%; max-width: 360px; height: auto; display: block; }
@media (max-width: 880px) {
  .top-inner { grid-template-columns: 1fr; max-width: 640px; gap: 32px; }
  .top-visual { display: none; }
}
@media (wmax-width: 640px) {
  .top-wrap { padding-top: 56px; }
  .top-inner { padding-top: 36px; padding-bottom: 48px; }
}
.top-eyebrow {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .1em; color: var(--brand); margin-bottom: 14px;
}
.top-inner h1 {
  font-size: clamp(2rem, 4.5vw, 2.8rem);
  font-weight: 800; color: var(--text);
  line-height: 1.2; margin-bottom: 12px;
}
.top-inner p {
  font-size: 1.1rem; color: var(--muted); line-height: 1.6; margin-bottom: 0;
}

/* QUIZ CARD */
.quiz-card {
  background: #fff; border: 1.5px solid var(--line);
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 4px 24px rgba(120,81,169,.08);
  position: relative;
}
.quiz-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--brand), #a07dd0);
}
.quiz-progress-track {
  height: 8px; background: #e5e7eb;
}
.quiz-progress-fill {
  height: 100%; background: var(--brand);
  width: 0%; transition: width .35s ease;
}
.quiz-body { padding: 28px 32px 32px; }
@media (max-width: 520px) { .quiz-body { padding: 20px 20px 24px; } }

.quiz-step { display: none; }
.quiz-step.active { display: block; }
.quiz-q {
  font-size: 1.2rem; font-weight: 700; color: var(--text);
  margin-bottom: 18px; line-height: 1.4;
}
.quiz-options { display: flex; flex-direction: column; gap: 10px; }
.quiz-opt {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 20px; border: 1.5px solid var(--line);
  border-radius: 12px; cursor: pointer;
  background: transparent; font-family: 'Poppins', sans-serif;
  font-size: 1rem; color: var(--text); font-weight: 500;
  transition: all .15s; text-align: left; width: 100%;
}
.quiz-opt i { color: var(--brand); font-size: 1rem; flex-shrink: 0; width: 18px; text-align: center; }
.quiz-opt:hover { border-color: var(--brand); background: rgba(120,81,169,.04); }
.quiz-opt.selected { border-color: var(--brand); background: rgba(120,81,169,.06); }

/* RESULT */
.quiz-result { display: none; }
.quiz-result.active { display: block; }
.result-box {
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 12px; padding: 18px 20px; margin-bottom: 18px;
}
.result-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .1em; color: var(--brand); margin-bottom: 7px;
}
.result-msg { font-size: 1.05rem; color: var(--text); line-height: 1.6; }
.book-btn {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  width: 100%; padding: 16px 20px;
  background: var(--brand); color: #fff; border: none; border-radius: 12px;
  font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1.05rem;
  cursor: pointer; transition: background .2s;
}
.book-btn:hover { background: #6a45a0; }
.book-note {
  text-align: center; font-size: .82rem; color: var(--muted); margin-top: 10px;
}
.book-note i { color: var(--green); margin-right: 3px; }

/* BOOKING EMBED */
.booking-wrap {
  display: none; margin-top: 28px;
  background: #fff; border: 1.5px solid var(--line);
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,.06);
  position: relative;
  animation: fadeUp .4s ease both;
}
.booking-wrap::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--brand), #a07dd0);
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.booking-wrap.visible { display: block; }
.booking-header { padding: 20px 28px; border-bottom: 1px solid var(--line); text-align: center; }
.booking-header h3 { font-size: 1rem; font-weight: 700; margin-bottom: 3px; }
.booking-header p { font-size: .87rem; color: var(--muted); margin: 0; }
.meetings-iframe-container { height: 1050px; }
.meetings-iframe-container iframe { height: 1050px !important; min-height: 1050px !important; }
.booking-wrap { overflow: visible; }
@media (max-width: 600px) {
  .meetings-iframe-container { height: 1050px !important; }
  .meetings-iframe-container iframe { height: 1050px !important; min-height: 1050px !important; }
}

/* BELOW SECTIONS */
.section { padding: 72px 20px; }
.section-alt { background: var(--bg-2); }
.sec-label {
  text-align: center; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .12em;
  color: var(--brand); margin-bottom: 10px;
}
.sec-h2 {
  text-align: center; font-size: clamp(1.7rem, 3vw, 2.2rem);
  font-weight: 800; margin-bottom: 8px; color: var(--text);
}
.sec-sub {
  text-align: center; color: var(--muted); font-size: 1.05rem;
  max-width: 440px; margin: 0 auto 40px; line-height: 1.6;
}

/* Steps */
.steps-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
  max-width: 820px; margin: 0 auto; position: relative;
}
@media (max-width: 640px) { .steps-grid { grid-template-columns: 1fr; max-width: 420px; gap: 20px; } }
.steps-grid::before {
  content: ''; position: absolute; top: 44px;
  left: calc(33.333% + 16px); right: calc(33.333% + 16px);
  height: 1px; background: rgba(120,81,169,.25); z-index: 0;
}
@media (max-width: 640px) { .steps-grid::before { display: none; } }
.step-card {
  background: #fff; border: 1.5px solid #e9eaf0;
  border-radius: 20px; padding: 36px 22px 30px; text-align: center;
  position: relative; z-index: 1; overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,.04);
  transition: transform .25s, border-color .25s, box-shadow .25s;
}
.step-card::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, #7c3aed, #7851a9); opacity: 0; transition: opacity .25s;
}
.step-card:hover { transform: translateY(-5px); border-color: rgba(120,81,169,.25); box-shadow: 0 12px 36px rgba(120,81,169,.1); }
.step-card:hover::after { opacity: 1; }
.step-num {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, #7c3aed, #7851a9); color: #fff;
  font-size: 1.4rem; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 20px;
  box-shadow: 0 8px 24px rgba(120,81,169,.3);
  position: relative; z-index: 1; transition: transform .25s;
}
.step-card:hover .step-num { transform: scale(1.08); }
.step-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
.step-card p { font-size: .95rem; color: var(--muted); line-height: 1.65; margin: 0; }

/* Included */
.included-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 10px; max-width: 620px; margin: 0 auto;
}
@media (max-width: 480px) { .included-grid { grid-template-columns: 1fr; } }
.included-item {
  display: flex; align-items: center; gap: 11px;
  background: #fff; border: 1px solid var(--line);
  border-radius: 10px; padding: 14px 18px;
  font-size: 1rem; font-weight: 500; color: var(--text);
}
.included-item i { color: var(--green); font-size: .82rem; flex-shrink: 0; }
.included-note {
  text-align: center; margin-top: 18px;
  font-size: .88rem; color: var(--muted);
}
.included-note a { color: var(--brand); font-weight: 600; }

/* Samples */
.samples-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
  max-width: 860px; margin: 0 auto;
}
@media (max-width: 680px) { .samples-grid { grid-template-columns: 1fr; max-width: 340px; } }
.sample-card {
  border: 1px solid var(--line); border-radius: 14px;
  overflow: hidden; transition: all .2s; display: block; color: inherit;
  background: #fff;
}
.sample-card:hover { transform: translateY(-4px); box-shadow: 0 10px 28px rgba(0,0,0,.08); border-color: rgba(120,81,169,.3); }
.sample-card img { width: 100%; display: block; border-bottom: 1px solid var(--line); }
.sample-info { padding: 15px; }
.sample-info h4 { font-size: 1rem; font-weight: 700; margin-bottom: 3px; }
.sample-info p { font-size: .9rem; color: var(--muted); margin: 0; }

/* FOOTER */
footer { background: #000; padding: 60px 20px 40px; border-top: 1px solid rgba(255,255,255,.08); }
.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; max-width: 1100px; margin: 0 auto 48px; }
@media (max-width: 768px) { .footer-grid { grid-template-columns: 1fr 1fr; gap: 32px; } }
@media (max-width: 480px) { .footer-grid { grid-template-columns: 1fr; gap: 28px; } }
.footer-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.footer-brand img { height: 32px; }
.footer-brand span { font-weight: 700; font-size: 1.1rem; color: #fff; }
.footer-tagline { color: #a0a6c0; font-size: .9rem; line-height: 1.6; margin-bottom: 20px; max-width: 280px; }
.footer-social { display: flex; gap: 12px; }
.footer-social a { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background: rgba(255,255,255,.06); border-radius: 10px; color: #a0a6c0; transition: all .2s; }
.footer-social a:hover { background: #ffd700; color: #1a1a2e; }
.footer-col h5 { font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #fff; margin: 0 0 16px; }
.footer-col ul { list-style: none; padding: 0; margin: 0; }
.footer-col li { margin-bottom: 10px; }
.footer-col a { color: #a0a6c0; font-size: .9rem; transition: color .2s; }
.footer-col a:hover { color: #ffd700; }
.footer-bottom { max-width: 1100px; margin: 0 auto; padding-top: 24px; border-top: 1px solid rgba(255,255,255,.08); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
.footer-bottom p { color: #6b7280; font-size: .85rem; margin: 0; }
.footer-legal { display: flex; gap: 24px; }
.footer-legal a { color: #6b7280; font-size: .85rem; transition: color .2s; }
.footer-legal a:hover { color: #ffd700; }
@media (max-width: 600px) { .footer-bottom { flex-direction: column; text-align: center; } }
html { font-size: 17px; }
</style>

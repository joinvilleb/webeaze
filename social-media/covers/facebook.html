<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>WebEaze Facebook cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Facebook page cover. Rendered at 1640x624 (2x the 820x312 desktop slot).
   Mobile shows a narrower centre crop, so everything important stays inside .safe. */
:root{ --brand:#7851a9; --brand-lt:#9b72cc; --gold:#f5c542; --ink:#1b1726; --cream:#faf7f2; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
     background:#dedde3;padding:26px;display:flex;flex-direction:column;gap:26px}
.cover{width:1640px;height:624px;position:relative;overflow:hidden;display:grid;place-items:center;flex-shrink:0}
.safe{width:1180px;display:flex;align-items:center;justify-content:center;gap:52px}

/* floating cute shapes */
.blob{position:absolute;border-radius:50%;pointer-events:none}

/* ── A: cream, friendly, little browser card ── */
.a{background:var(--cream)}
.a .b1{width:300px;height:300px;background:rgba(120,81,169,.07);left:-70px;top:-90px}
.a .b2{width:190px;height:190px;background:rgba(245,197,66,.20);right:80px;bottom:-70px}
.a .b3{width:74px;height:74px;background:rgba(120,81,169,.13);right:290px;top:66px}
.a .copy{flex:1}
.a h1{font-size:62px;font-weight:800;letter-spacing:-.035em;line-height:1.06;color:var(--ink)}
.a h1 span{color:var(--brand)}
.a p{margin-top:18px;font-size:26px;color:#5c5670;line-height:1.45;max-width:600px}
.a .win{width:330px;flex-shrink:0;background:#fff;border-radius:22px;box-shadow:0 22px 54px rgba(27,23,38,.14);overflow:hidden}
.a .win .bar{height:44px;background:#f2eef8;display:flex;align-items:center;gap:8px;padding:0 18px}
.a .win .bar i{width:11px;height:11px;border-radius:50%;background:#d6cbe6;display:block}
.a .win .body{padding:22px}
.a .win .l{height:15px;border-radius:99px;background:#efeaf6;margin-bottom:12px}
.a .win .l.s{width:58%}
.a .win .l.m{width:82%}
.a .win .btn{margin-top:16px;height:38px;width:132px;border-radius:99px;background:var(--brand);
             display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700}
.a .face{position:absolute;right:56px;bottom:44px;font-size:30px}

/* ── B: purple, warm, centred ── */
.b{background:linear-gradient(135deg,#8a5fbd 0%,var(--brand) 46%,#54397a 100%);color:#fff}
.b .b1{width:330px;height:330px;background:rgba(255,255,255,.07);left:-90px;bottom:-120px}
.b .b2{width:150px;height:150px;background:rgba(245,197,66,.22);right:150px;top:-40px}
.b .safe{flex-direction:column;gap:0;text-align:center}
.b .mark{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.b .mark img{height:40px}
.b .mark .badge{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.16)}
.b .mark b{font-size:34px;font-weight:700;letter-spacing:-.02em}
.b h1{font-size:58px;font-weight:800;letter-spacing:-.035em;line-height:1.08}
.b h1 span{color:#ffdf7e}
.b p{margin-top:16px;font-size:25px;color:rgba(255,255,255,.86)}
.b .pills{margin-top:26px;display:flex;gap:12px}
.b .pills span{font-size:19px;font-weight:600;padding:11px 24px;border-radius:99px;background:rgba(255,255,255,.16)}
</style></head><body>

<div class="cover a" id="cover-a">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="safe">
    <div class="copy">
      <h1>Websites for people<br>who'd rather be doing<br><span>literally anything else.</span></h1>
      <p>We build it, host it and keep it updated. You go run the business.</p>
    </div>
    <div class="win">
      <div class="bar"><i></i><i></i><i></i></div>
      <div class="body">
        <div class="l m"></div><div class="l s"></div><div class="l m"></div>
        <div class="btn">Get a quote</div>
      </div>
    </div>
  </div>
</div>

<div class="cover b" id="cover-b">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="safe">
    <div class="mark"><span class="badge"><img src="../../images/webeaze-transparent-copy.png" alt=""></span><b>WebEaze</b></div>
    <h1>Small business websites,<br><span>done for you.</span></h1>
    <p>Built, hosted and updated for one flat monthly price.</p>
    <div class="pills"><span>No contract</span><span>Free preview in 48 hours</span><span>From $169/mo</span></div>
  </div>
</div>

</body></html>

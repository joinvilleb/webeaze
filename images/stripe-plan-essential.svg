<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f0ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7851a9"/>
      <stop offset="100%" stop-color="#9b7bc7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(120,81,169,0.18)"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg)"/>

  <circle cx="340" cy="60" r="80" fill="rgba(120,81,169,0.07)"/>
  <circle cx="60" cy="340" r="60" fill="rgba(120,81,169,0.05)"/>

  <rect x="80" y="110" width="240" height="180" rx="20" fill="white" filter="url(#shadow)"/>

  <rect x="80" y="110" width="240" height="5" rx="2.5" fill="url(#pill)"/>

  <text x="200" y="168" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#7851a9" text-anchor="middle" letter-spacing="2" text-transform="uppercase">ESSENTIAL PLAN</text>

  <text x="200" y="222" font-family="'Segoe UI', system-ui, sans-serif" font-size="56" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="-2">$169</text>

  <text x="200" y="248" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">per month</text>

  <line x1="120" y1="268" x2="280" y2="268" stroke="rgba(0,0,0,0.07)" stroke-width="1"/>

  <text x="200" y="288" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">Custom design · Hosting · Unlimited updates</text>

  <rect x="130" y="330" width="140" height="30" rx="15" fill="url(#pill)"/>
  <text x="200" y="350" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle" letter-spacing="0.5">Get Started</text>

  <text x="200" y="390" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#9b7bc7" text-anchor="middle" font-weight="600">webeaze.io</text>
